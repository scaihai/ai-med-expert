<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MedExpert – AI-powered Pressure Ulcer specialist for medical practitioners. Evidence-based answers using ClinicalBERT.">
  <title>MedExpert – Pressure Ulcer Specialist</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app-shell">

    <!-- ==================== Sidebar ==================== -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">M</div>
        <span class="sidebar-brand-name">MedExpert</span>
        <button id="btn-close-sidebar" class="btn-close-sidebar" title="Close Sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <button id="btn-new-conv" class="btn-new-conv">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Conversation
      </button>

      <div class="conv-list">
        <div class="conv-list-label">Recent Conversations</div>
        <div id="conv-list-items"></div>
      </div>

      <!-- Settings -->
      <div class="settings-panel">
        <div class="settings-label">Settings</div>

        <div class="toggle-row">
          <span class="toggle-row-label">Show confidence in answers</span>
          <div id="toggle-confidence" class="toggle-track">
            <div class="toggle-thumb"></div>
          </div>
        </div>

        <div class="slider-group">
          <div class="slider-header">
            <span>Minimum Answer Confidence</span>
            <span id="slider-value">80%</span>
          </div>
          <div class="slider-wrap">
            <div class="slider-bg">
              <div id="slider-fill" class="slider-fill" style="width:80%"></div>
              <div id="slider-dot" class="slider-dot" style="left:80%"></div>
            </div>
            <input type="range" id="slider-threshold" min="1" max="100" value="80">
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        Developed by Destiny Gogo-fyneface
      </div>
    </aside>

    <!-- ==================== Main Area ==================== -->
    <div class="main-area">

      <!-- Header -->
      <header class="chat-header">
        <button id="btn-open-sidebar" class="btn-toggle-sidebar" style="display:none">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><polyline points="14 9 17 12 14 15"/></svg>
        </button>
        <div class="chat-header-title">
          Pressure Ulcer Specialist
        </div>
      </header>

      <!-- Messages -->
      <div id="messages-scroll" class="messages-scroll">
        <div id="messages-container" class="messages-container">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- Input -->
      <div class="input-area">
        <div class="input-wrapper">
          <div class="input-box">
            <textarea
              id="chat-input"
              rows="1"
              placeholder="Ask a question about pressure ulcer staging, treatment, or risk..."
            ></textarea>
            <button id="btn-send" class="btn-send disabled">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
          <p class="input-disclaimer">
            AI-generated medical information should be verified by a licensed clinician before implementation.
          </p>
        </div>
      </div>

    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
